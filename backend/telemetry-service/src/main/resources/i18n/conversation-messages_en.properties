# --- Conversation copy --------------------------------------------------------------------------
# {0} operator name, {1} state, {2} start keyword
conversation.welcome=Dear {0},\n\
  \n\
  You have been registered as Pump Operator for {1} in Jalsoochak.\n\
  \n\
  You can use this number to:\n\
  - Share photos of the bulk flow meter\n\
  - Report water supply issues\n\
  \n\
  Reply {2} to begin.\n
conversation.issuePrompt=Please select your issue by typing any of the number
conversation.othersPrompt=Please report your issue.
conversation.telemetryIssuePrompt=Please select your issue.
conversation.meterChangePrompt=Please select the no submission reasons by typing any of the number
conversation.issueReported=Issue reported. Thank you.
conversation.meterChangeSelected=Successfully selected.
conversation.locationSaved=Location saved successfully.
# No "Yes | No": those are quick-reply buttons the chatbot flow renders.
conversation.locationBoundaryWarning=System detected that reading is being submitted outside the Scheme boundary. Do you want to proceed?
