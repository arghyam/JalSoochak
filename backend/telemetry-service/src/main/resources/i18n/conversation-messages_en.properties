conversation.readingAboveSchemeMaximum=Reading rejected because it is above the allowed maximum for this scheme. Submitted: {0}.
conversation.noPreviousReading=No previous submitted reading found. Please submit a reading first.
conversation.readingRejected=Please enter the correct meter reading.
conversation.nothingToReject=No reading from today was found to correct. Please send a new meter image.
conversation.rejectionFailed=The reading could not be corrected. Please try again.
# The defaults for copy a tenant can configure; {0} is what the tenant template calls {channel},
# {item}, {language} or {reading}.
conversation.channelPrompt=Please select your preferred channel by typing the corresponding number:
conversation.channelSelected=Channel selected: {0}
conversation.itemPrompt=Please select what you want to do:
conversation.itemSelected={0} selected
conversation.languageSelected=Language selected: {0}
conversation.takeReadingPrompt=Please type your meter reading manually (numbers only).
conversation.manualReadingSaved=Manual reading {0} saved successfully.
conversation.schemePrompt=Please select a scheme:
# {0} scheme name
conversation.schemeSelected=Scheme selected: {0}
# A scheme with no name, labelled by {0} its id
conversation.unnamedScheme=Scheme {0}
conversation.previousReadingUpdated=Previous reading updated successfully.
conversation.pleaseWait=please wait a second...
conversation.invalidChoice=invalid choice, please restart the flow
# {0} the number of options
conversation.chooseNumberInRange=Please choose a number between 1 and {0}.
# Stand-ins for an operator with no name and a tenant with no state name, in the welcome message,
# and for the name in a tenant's intro greeting ("Hi {name}")
conversation.defaultOperatorName=Operator
conversation.defaultStateName=your state
