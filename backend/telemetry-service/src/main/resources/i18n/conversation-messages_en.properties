# Chatbot reply copy in English: the source text for every translation, and the copy an operator
# gets when their language has no translation for a key. Keys are ConversationMessageCode keys.
#
# Every value is a java.text.MessageFormat pattern, with or without arguments: write an apostrophe
# as '' and a literal brace as '{'. {0}, {1}, ... are inserted as plain text.

