server:
  port: 8087
  compression:
    enabled: true
    mime-types: application/json,application/*+json,text/plain,text/html,text/xml,application/xml
    min-response-size: 1024

spring:
  application:
    name: analytics-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 2
      connection-timeout: 30000
      initialization-fail-timeout: -1
      # PostGIS may live in analytics_schema (extension SCHEMA) or public; geom columns follow the same type.
      # Without this, JDBC default search_path can miss ST_* overloads for analytics_schema.geometry.
      connection-init-sql: SET search_path TO analytics_schema, public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas:
      - analytics_schema

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: analytics_schema

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://jalsoochak.beehyv.com/keycloak/realms/jalsoochak-realm}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: analytics-service-group
      auto-offset-reset: earliest

keycloak:
  realm: jalsoochak-realm
  auth-server-url: https://jalsoochak.beehyv.com/keycloak
  resource: jalsoochak-client-id

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    # Disable client-side syntax highlighting. highlight.js' recursive
    # processLines overflows the JS call stack ("Maximum call stack size
    # exceeded") on large/deeply nested responses (e.g. water-quantity/
    # region-wise), causing "Could not render responses". Plain-text
    # rendering avoids the highlighter entirely; the response still renders.
    syntax-highlight:
      activated: false
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"

  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: analytics-service

logging:
  file:
    name: ${LOG_FILE_PATH:../logger/logs/backend-services.log}

  # Plain console: key=value pairs from SLF4J 2 (see logback-spring.xml). JSON lines: add profile "json-logs".
  pattern:
    level: "service=${spring.application.name} %5p"

# Daily Water Service Situation Report (officer daily PDF) — the KPI computation side.
daily-report:
  sections:
    outage-details:
      # Priority Actions + Reasons for No Water Supply. Hidden by default in the rendered PDF
      # (message-service reads the same property / env var), so their two queries are skipped here
      # rather than run for output no one sees. Flip both services together to restore the sections.
      enabled: ${DAILY_REPORT_OUTAGE_SECTIONS_ENABLED:false}

# single tenant mode is disabled by default
analytics:
  single-tenant-mode: ${SINGLE_TENANT_MODE:false}

  dashboard:
    # Comma-separated work_status values whose schemes are included in dashboard calculations.
    # 4 = handed-over. Extend this list (e.g. "4,5") to include more statuses without a code change.
    # Empty/blank disables the filter (all schemes included).
    included-work-statuses: ${ANALYTICS_DASHBOARD_INCLUDED_WORK_STATUSES:4}

    cache:
      # TTL (seconds) for cached KPI/dashboard responses whose window still includes "today". Today's
      # data keeps accumulating through the day, so these are refreshed on this short cadence instead of
      # being frozen for a full day (immutable windows ending on/before yesterday keep the 24h TTL). Set
      # to 0 (or negative) to disable caching for current-day windows entirely and serve them fully live.
      current-day-ttl-seconds: ${ANALYTICS_DASHBOARD_CACHE_CURRENT_DAY_TTL_SECONDS:1800}

    continuous-schemes:
      # Toggles the work_status filter for the continuous-schemes count/list API ONLY (tenant
      # dashboards; never the national tenant 0). Every other dashboard API always applies the filter.
      # true  = restrict continuous-schemes to included-work-statuses schemes.
      # false = count/list all schemes regardless of work_status. Flip without a code change (default).
      work-status-filter-enabled: ${ANALYTICS_DASHBOARD_CONTINUOUS_SCHEMES_WORK_STATUS_FILTER_ENABLED:false}

    regularity:
      # Percentage of days in a window on which a scheme must supply water to count as "regular".
      # Last tier of the fallback chain: a tenant's own REGULARITY_THRESHOLD_PERCENT config wins, then
      # the national default (tenant 0), then this value. Must be > 0 and <= 100.
      threshold-percent: ${ANALYTICS_DASHBOARD_REGULARITY_THRESHOLD_PERCENT:90}
      # Window applied to /scheme-regularity/average when start and end date are the same day: a
      # single day is too small a sample for a share-of-days KPI, so it expands to this many trailing
      # days (inclusive of the requested day). Not per-tenant configurable.
      single-day-lookback-days: ${ANALYTICS_DASHBOARD_REGULARITY_SINGLE_DAY_LOOKBACK_DAYS:30}

  water-quantity:
    # fact_water_quantity_table.water_quantity is stored in LITRES; meters read in cubic metres, so
    # ingestion multiplies by 1000. A daily volume above this many m3 cannot be real for a single
    # scheme (100,000 m3 = 100 MLD) and almost certainly means a misread or replaced meter. Such rows
    # are logged at WARN and counted (water_quantity.implausible) but stored as derived — never
    # clamped, which would fabricate a plausible number and hide the bad reading.
    implausible-daily-cubic-metres: ${ANALYTICS_WATER_QUANTITY_IMPLAUSIBLE_DAILY_CUBIC_METRES:100000}

  scheduler:
    common:
      cron: ${ANALYTICS_SCHEDULER_CRON:0 0 0 * * *}
      zone: ${ANALYTICS_SCHEDULER_ZONE:Asia/Kolkata}
    national-dashboard:
      lookback-days: ${ANALYTICS_NATIONAL_DASHBOARD_LOOKBACK_DAYS:30}
    scheme-status:
      # Age after which a scheme with no confirmed meter reading is reported as "critical" by
      # GET /analytics/critical-schemes. Computed live per request; stores nothing.
      critical-after-days: ${ANALYTICS_SCHEME_STATUS_CRITICAL_AFTER_DAYS:30}

    dim-date-backfill:
      cron: ${ANALYTICS_DIM_DATE_BACKFILL_CRON:0 10 0 * * *}

---
# One JSON object per line (ELK/Loki-friendly). Example: SPRING_PROFILES_ACTIVE=json-logs
spring:
  config:
    activate:
      on-profile: json-logs
# logback-spring.xml picks up profile "json-logs" automatically; no extra properties required here.
