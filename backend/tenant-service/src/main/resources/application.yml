server:
  port: 8081

app:
  single-tenant-mode: ${SINGLE_TENANT_MODE:false}

spring:
  config:
    import: optional:file:./tenant-service/.env[.properties],optional:file:.env[.properties]

  application:
    name: tenant-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 30000
      initialization-fail-timeout: -1
      connection-init-sql: SET search_path TO common_schema, public

  flyway:
    enabled: true
    baseline-version: 0
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: common_schema
    schemas: common_schema

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: common_schema

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://jalsoochak.beehyv.com/keycloak/realms/jalsoochak-realm}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: tenant-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
      properties:
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000
        max.poll.interval.ms: 600000
        fetch.max.wait.ms: 500

keycloak:
  realm: jalsoochak-realm
  auth-server-url: https://jalsoochak.beehyv.com/keycloak
  resource: jalsoochak-client-id

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Must equal <swagger-ui.version> in pom.xml. springdoc 2.5.0 ships
    # springdoc.config.properties with springdoc.swagger-ui.version=5.13.0 and uses it to
    # build the webjar resource path (AbstractSwaggerResourceResolver), so without this
    # override every /webjars/swagger-ui/** asset 404s against the pinned webjar.
    version: 5.32.14
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      show-details: when-authorized

# ────────────────────────────────────────────────────────────── # Nudge & Escalation Scheduler Configuration # ──────────────────────────────────────────────────────────────
# Fallback defaults used when a tenant has no row in tenant_config_master_table
nudge:
  schedule:
    hour: 18
    minute: 00
escalation:
  schedule:
    hour: 18
    minute: 00
  level1:
    threshold:
      days: 3 # Days of missed uploads before level-1 officer is notified
    officer:
      user_type: SECTION_OFFICER
  level2:
    threshold:
      days: 7 # Days before level-2 officer is notified
    officer:
      user_type: DISTRICT_OFFICER
# Daily Water Service Situation Report — per-tenant daily cron (IST).
#
# The report covers TODAY from 00:00 up to this time, so the schedule IS the window: moving it to
# 17:00 makes the report cover 00:00-17:00. The PDF's "Reporting Period" line is rendered from this
# value, so it stays truthful. Section Officers only — SDOs receive the weekly report instead.
# Overridable per tenant via common_schema.tenant_config_master_table key DAILY_SITUATION_REPORT_TIME.
daily-report:
  schedule:
    hour: ${DAILY_REPORT_SCHEDULE_HOUR:16}
    minute: ${DAILY_REPORT_SCHEDULE_MINUTE:00}
  officer:
    user-types: ${DAILY_REPORT_OFFICER_USER_TYPES:SECTION_OFFICER}
# Weekly Water Service Situation Report — per-tenant weekly cron (IST), for both SO and SDO.
#
# Two independent settings, both in the cron convention 0-7 where both 0 and 7 are Sunday, 1 is Monday:
#   schedule.day-of-week  — WHEN the job fires.
#   week-start-day        — WHICH seven days it reports on. The window is always the last COMPLETE week
#                           beginning on this day, so 1 gives Monday-Sunday and 4 gives Thursday-Wednesday.
#                           It never includes a day that has not finished.
# Setting the two to different days is legal (report a Thu-Wed week, deliver it on Friday) but usually
# unintended, so the scheduler logs a WARN: the further the firing day is past the end of the window,
# the staler the data is when it arrives.
# Overridable per tenant via common_schema.tenant_config_master_table key WEEKLY_SITUATION_REPORT_TIME.
weekly-report:
  schedule:
    day-of-week: ${WEEKLY_REPORT_SCHEDULE_DAY_OF_WEEK:1}
    hour: ${WEEKLY_REPORT_SCHEDULE_HOUR:09}
    minute: ${WEEKLY_REPORT_SCHEDULE_MINUTE:00}
  week-start-day: ${WEEKLY_REPORT_WEEK_START_DAY:1}
  officer:
    user-types: ${WEEKLY_REPORT_OFFICER_USER_TYPES:SECTION_OFFICER,SUB_DIVISIONAL_OFFICER}
storage:
  enabled: ${STORAGE_ENABLED:false} # set to true to activate S3-compatible storage
  provider: ${STORAGE_PROVIDER:s3}
  endpoint: ${STORAGE_ENDPOINT:} # required when enabled; URL of the S3-compatible store
  region: ${STORAGE_REGION:ap-south-1}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  bucket: ${STORAGE_BUCKET:tenant-assets}

spring.servlet.multipart:
  max-file-size: 2MB
  max-request-size: 2MB

logging:
  file:
    name: ${LOG_FILE_PATH:../logger/logs/backend-services.log}
  pattern:
    level: "service=${spring.application.name} %5p"

pii:
  encryption-key: ${PII_ENCRYPTION_KEY}
  hmac-key: ${PII_HMAC_KEY}

# MESSAGING-PROVIDER-SECRETS: master keys (KEKs) for the per-tenant messaging credential
# store. Independent of pii.* above on purpose — a compromise of one must not read the other.
#
# Defaults are empty and that is a supported state: a deployment that does not use
# per-tenant providers needs no new environment variable, and the secret endpoints answer
# 503 rather than the service refusing to start. Configure a key and the store switches on.
#
# Each value is a base64-encoded 32-byte key. Rules, all checked at startup:
#   * keep these OUT of the database, the repo, the vault entry holding the DB password,
#     and any backup taken with the database — a stolen backup alone must be useless
#   * staging and production use DIFFERENT keys, so a dump restored into the wrong
#     environment fails to decrypt instead of silently using the wrong credentials
#   * back them up separately from the database and test the restore: losing a key makes
#     every tenant secret unrecoverable and each state admin has to re-enter theirs
#
# To rotate: add v2, point active-master-key-id at it, POST
# /api/v1/system/messaging-secrets/rewrap, then remove v1 once no key still names it.
messaging:
  provider:
    # Whether a tenant's SMTP host may resolve to a loopback/private address. Local development
    # against a mail catcher only; must stay false in every deployed environment.
    allow-internal-hosts: ${MESSAGING_PROVIDER_ALLOW_INTERNAL_HOSTS:false}
  secret:
    active-master-key-id: ${MESSAGING_SECRET_ACTIVE_MASTER_KEY_ID:}
    master-keys:
      v1: ${MESSAGING_SECRET_MASTER_KEY_V1:}
      # v2: ${MESSAGING_SECRET_MASTER_KEY_V2:}   # added during a rotation; both stay readable

tenant:
  defaults:
    lgd-location-hierarchy:
      - level: 1
        level-name:
          - title: "State"
      - level: 2
        level-name:
          - title: "District"
      - level: 3
        level-name:
          - title: "Block"
      - level: 4
        level-name:
          - title: "Panchayat"
      - level: 5
        level-name:
          - title: "Village"
    dept-location-hierarchy:
      - level: 1
        level-name:
          - title: "State"
      - level: 2
        level-name:
          - title: "Zone"
      - level: 3
        level-name:
          - title: "Circle"
      - level: 4
        level-name:
          - title: "Division"
      - level: 5
        level-name:
          - title: "Sub Division"
    meter-change-reasons:
      - id: "METER_REPLACED"
        name: "Meter Replaced"
        sequence-order: 1
        is-default: true
        editable: true
      - id: "METER_NOT_WORKING"
        name: "Meter Not Working"
        sequence-order: 2
        is-default: true
        editable: true
      - id: "METER_DAMAGED"
        name: "Meter Damaged"
        sequence-order: 3
        is-default: true
        editable: true
    supply-outage-reasons:
      - id: "ELECTRICITY_SUPPLY_DISCONNECTED"
        name: "Electricity Supply Disconnected"
        sequence-order: 1
        is-default: true
        editable: true
      - id: "NO_ELECTRICITY_SUPPLY_TODAY"
        name: "No Electricity Supply Today"
        sequence-order: 2
        is-default: true
        editable: true
      - id: "PUMP_FAILURE"
        name: "Pump Failure"
        sequence-order: 3
        is-default: true
        editable: true
      - id: "PIPELINE_BREAK"
        name: "Pipeline Break"
        sequence-order: 4
        is-default: true
        editable: true
      - id: "WATER_QUALITY_ISSUES"
        name: "Water Quality Issues"
        sequence-order: 5
        is-default: true
        editable: true
      - id: "SOURCE_DRYING"
        name: "Source Drying"
        sequence-order: 6
        is-default: true
        editable: true
      - id: "NATURAL_CALAMITY"
        name: "Natural Calamity"
        sequence-order: 7
        is-default: true
        editable: true
      - id: "OTHERS"
        name: "Others"
        sequence-order: 8
        is-default: true
        editable: false
