# Disable infrastructure that requires external services during tests
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none
eureka.client.enabled=false

# Placeholder Kafka config – not needed for unit/integration tests
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.admin.fail-fast=false
spring.kafka.consumer.group-id=test-group

# Glific – auth URL must be present but is overridden or mocked per test
glific.auth-url=http://localhost:9999/mock-glific
glific.username=test-user
glific.password=test-password
glific.api-url=http://localhost:9999/mock-api
glific.flow.nudge-id=test-flow-id
glific.flow.welcome-id=test-welcome-flow-id
glific.template.escalation-id=67890

# MinIO – real client instantiates but upload is mocked in tests
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=test-bucket
minio.base-url=http://localhost:9000

# Escalation report directory – use a temp location in tests
escalation.report.dir=${java.io.tmpdir}/escalation-reports-test/

# app.base-url – suppress the localhost warning; tests don't send real WhatsApp
app.base-url=http://localhost:8085

# Zero out Glific throttle so WireMock tests don't incur sleep delays
glific.request-interval-ms=0

# notification.mail – satisfies MailProperties binding; SendGridMailSender is not
# activated in tests (provider defaults to sendgrid but no real API calls are made
# because tests either mock the SendGrid client or don't load the full context)
notification.mail.provider=sendgrid
notification.mail.from-address=noreply@test.example.com
notification.mail.from-name=JalSoochakTest
notification.mail.logo-image-url=https://test.logo/logo.png
notification.mail.sendgrid.api-key=SG.test-key
notification.mail.sendgrid.templates.password-reset=d-test-pw-reset
notification.mail.sendgrid.templates.reinvitation=d-test-reinvite
notification.mail.sendgrid.templates.default-invitation=d-test-default
notification.mail.sendgrid.templates.super-user-invitation=d-test-superuser
notification.mail.sendgrid.templates.state-admin-invitation=d-test-stateadmin

# spring.mail — satisfies placeholder resolution for spring.mail.username / spring.mail.password
# in application.yml (required even when provider=sendgrid, because the placeholders are
# unconditionally present in the YAML and would throw on startup if unresolved)
spring.mail.username=test-user
spring.mail.password=test-pass

# notification.mail.smtp — satisfies SmtpTemplates binding when full Spring context loads
notification.mail.smtp.templates.password-reset.subject=Reset Your JalSoochak Password
notification.mail.smtp.templates.password-reset.body=Dear User,\n\nReset: {reset_link}. Expires in {expiry_minutes} minutes.
notification.mail.smtp.templates.reinvitation.subject=Reminder: Your JalSoochak Invitation
notification.mail.smtp.templates.reinvitation.body=Dear {name},\n\nActivate: {activation_link}. Expires in {expiry_hours} hours.
notification.mail.smtp.templates.default-invitation.subject=You are invited to join JalSoochak
notification.mail.smtp.templates.default-invitation.body=Dear {name},\n\nActivate: {activation_link}. Expires in {expiry_hours} hours.
notification.mail.smtp.templates.super-user-invitation.subject=You are assigned as Super User by JalSoochak
notification.mail.smtp.templates.super-user-invitation.body=Dear {name},\n\nActivate: {activation_link}. Expires in {expiry_hours} hours.
notification.mail.smtp.templates.state-admin-invitation.subject=You are assigned as State System Admin by JalSoochak
notification.mail.smtp.templates.state-admin-invitation.body=Dear {name},\n\nManage {state_name}. Activate: {activation_link}. Expires in {expiry_hours} hours.
