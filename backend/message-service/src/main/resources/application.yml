server:
  port: 8085

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

spring:
  application:
    name: message-service

  datasource:
    url: jdbc:postgresql://localhost:5432/shared_db
    username: YOUR_USERNAME
    password: YOUR_PASSWORD

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: message-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
      properties:
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000
        max.poll.interval.ms: 600000
        fetch.max.wait.ms: 500

  # SMTP mail config — required when notification.mail.provider=smtp
  mail:
    host: ${SPRING_MAIL_HOST:smtp.office365.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: false
            protocols: TLSv1.2
          connectiontimeout: 30000
          timeout: 30000
          writetimeout: 30000

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://jalsoochak.beehyv.com/keycloak/realms/jalsoochak-realm}

# ──────────────────────────────────────────────────────────────
# Notification Channel Credentials (to be provided later)
# ──────────────────────────────────────────────────────────────

notification:
  channel:
    # ── Webhook / Push Notification ─────────────────────────
    webhook:
      url: "" # Default webhook endpoint URL
      secret: "" # Shared secret for request signing

    # ── Email via SendGrid ──────────────────────────────────
    email:
      sendgrid-api-key: "" # SendGrid API key
      from-address: "noreply@example.com"
      from-name: "Water Management Platform"

    # ── Email via SMTP (JavaMailSender) ─────────────────────
    smtp:
      from-address: ${MAIL_FROM_EMAIL:noreply@example.com}
      from-name: ${MAIL_FROM_NAME:Jalsoochak}

  # ── Transactional login OTP SMS ────────────────────────────────────────────
  # Switch providers by changing 'provider'. No code changes required — add a new
  # SmsSender implementation annotated with
  # @ConditionalOnProperty(name = "notification.sms.provider", havingValue = "<name>").
  # provider: smscountry → requires SMSCOUNTRY_* env vars (default)
  sms:
    provider: ${SMS_PROVIDER:smscountry}

  # ── Transactional account emails (invite, reinvite, password-reset) ────────
  # Switch providers by changing 'provider'. No code changes required.
  # provider: smtp    → requires spring.mail.* block to be uncommented
  # provider: sendgrid → requires SENDGRID_API_KEY env var (default)
  mail:
    provider: ${MAIL_PROVIDER:sendgrid}
    from-address: ${MAIL_FROM_EMAIL:noreply@example.com}
    from-name: ${MAIL_FROM_NAME:Jalsoochak}
    logo-image-url: ${MAIL_LOGO_URL:https://lh3.googleusercontent.com/d/1WUwmfNG_wyWF_G31MaWCtWIsZCxHy5g2}
    sendgrid:
      api-url: https://api.sendgrid.com
      api-key: ${SENDGRID_API_KEY}
      templates:
        password-reset: ${SENDGRID_TEMPLATE_PASSWORD_RESET:d-f7088f302ac146faa4c165b7539e4cd9}
        reinvitation: ${SENDGRID_TEMPLATE_REINVITATION:d-b3e1cb24d3bc40b3b8c3f0c19c8cff79}
        default-invitation: ${SENDGRID_TEMPLATE_DEFAULT_INVITATION:d-4f225581b47a4c0ea8e1b84d4be740cb}
        super-user-invitation: ${SENDGRID_TEMPLATE_SUPER_USER_INVITATION:d-c0f4763d5bd948d0879d4bec9e015646}
        state-admin-invitation: ${SENDGRID_TEMPLATE_STATE_ADMIN_INVITATION:d-20c14eb80ba84feb87b157f4b1cf4bbc}

    # ── SMTP plain-text templates (used when provider: smtp) ─────────────────
    # Placeholders: {name}, {activation_link}, {expiry_hours},
    #               {reset_link}, {expiry_minutes}, {state_name}
    smtp:
      templates:
        password-reset:
          subject: "Reset Your JalSoochak Password"
          body: |
            Dear User,

            We received a request to reset the password associated with your JalSoochak account.
            If you did not initiate this request, please disregard this email — your account will remain secure.

            To reset your password, click the link below:

            Reset Password: {reset_link}

            This link will expire in {expiry_minutes} minutes.

            ---
            This is an automated message from the JalSoochak platform.
            Please do not reply to this email.
        reinvitation:
          subject: "Reminder: Your JalSoochak Invitation"
          body: |
            Dear {name},

            This is a reminder that you have a pending invitation to join the JalSoochak platform.
            A new activation link has been generated for you — please use it to set your password.

            Activate Account: {activation_link}

            This link will expire in {expiry_hours} hours.

            ---
            This is an automated message from the JalSoochak platform.
            Please do not reply to this email.
        default-invitation:
          subject: "You are invited to join JalSoochak"
          body: |
            Dear {name},

            You have been officially invited to join the JalSoochak platform — a national initiative
            for real-time water quality monitoring and reporting.

            To activate your account, please set a password using the link below:

            Activate Account: {activation_link}

            This link will expire in {expiry_hours} hours.

            ---
            This is an automated message from the JalSoochak platform.
            Please do not reply to this email.

            Supported by Arghyam Foundation | Ministry of Jal Shakti, Government of India
        super-user-invitation:
          subject: "You are assigned as Super User by JalSoochak"
          body: |
            Dear {name},

            You have been assigned as a Super User for JalSoochak platform. In this role you will be
            responsible for managing the JalSoochak at system level.

            To activate your account, please set a password using the link below:

            Activate Account: {activation_link}

            This link will expire in {expiry_hours} hours.

            ---
            This is an automated message from the JalSoochak platform.
            Please do not reply to this email.
        state-admin-invitation:
          subject: "You are assigned as State System Admin by JalSoochak"
          body: |
            Dear {name},

            You have been assigned as State System Administrator for JalSoochak platform. In this role
            you will be responsible for managing the JalSoochak for the state {state_name}.

            To activate your account, please set a password using the link below:

            Activate Account: {activation_link}

            This link will expire in {expiry_hours} hours from the time of send.

            ---
            This is an automated message from the JalSoochak platform.
            Please do not reply to this email.

keycloak:
  realm: jalsoochak-realm
  auth-server-url: https://jalsoochak.beehyv.com/keycloak
  resource: jalsoochak-client-id

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"

pii:
  encryption-key: ${PII_ENCRYPTION_KEY}
  hmac-key: ${PII_HMAC_KEY}

# ──────────────────────────────────────────────────────────────
# Escalation Report Configuration
# ──────────────────────────────────────────────────────────────

escalation:
  report:
    dir: /tmp/escalation-reports/ # Directory where escalation PDFs are saved

# Daily Water Service Situation Report (officer daily PDF)
daily-report:
  report:
    dir: ${DAILY_REPORT_DIR:/tmp/escalation-reports/} # reuses the escalation report dir by default
  dashboard-url: ${DAILY_REPORT_DASHBOARD_URL:https://jalsoochak.jjmbrain.in/staff/}
  support-phone: ${DAILY_REPORT_SUPPORT_PHONE:} # shown in the PDF footer; blank hides the line
  sections:
    outage-details:
      # Priority Actions + Reasons for No Water Supply. Hidden by default; set to true to restore both
      # sections — the remaining sections renumber automatically. analytics-service reads the same
      # property (same env var) and skips computing their data while they are hidden, so flip both.
      enabled: ${DAILY_REPORT_OUTAGE_SECTIONS_ENABLED:false}
  link:
    # Optional mirror of the URL prefix frozen into the approved LINK template, e.g.
    # https://jalsoochak.jjmbrain.in/minio/ (mind the trailing slash). When set it must equal
    # minio.base-url + "/" or the service refuses to start. This is the only check that catches an
    # environment deployed with another environment's template id or MINIO_BASE_URL: Glific accepts
    # the send either way, so otherwise the officer is the first to notice the button leads nowhere.
    # Leave blank to skip the check (a startup warning is logged instead).
    button-base-url: ${DAILY_REPORT_LINK_BUTTON_BASE_URL:}

# Base URL used to construct the public PDF download link sent via WhatsApp.
# For local dev: http://localhost:8085
# For demo with ngrok: https://<your-ngrok-id>.ngrok.io
app:
  base-url: ${APP_BASE_URL:http://localhost:8085}
  daily-report:
    # Delivers SUB_DIVISIONAL_OFFICER reports (SO layout + per-Section-Officer Summary breakdown).
    # Operational kill-switch — set APP_DAILY_REPORT_SDO_ENABLED=false to suppress SDO reports.
    sdo-enabled: ${APP_DAILY_REPORT_SDO_ENABLED:true}

# ──────────────────────────────────────────────────────────────
# Notification Guards (per channel / per purpose)
# whatsapp.dry-run  → master WhatsApp guard for the shared account
#   operations: login OTP, welcome flow, language update. Every purpose flag
#   below defaults to this value when its own flag is unset, so
#   NOTIFICATIONS_WHATSAPP_DRY_RUN=true still mutes everything.
# nudge.dry-run        → suppress only operator nudges (NOTIFICATIONS_NUDGE_DRY_RUN).
# escalation.dry-run   → suppress only officer (SO/SDO) escalation documents
#   (NOTIFICATIONS_ESCALATION_DRY_RUN). Set to false to deliver escalations
#   while nudges stay muted.
# daily-report.dry-run → suppress only the officer Daily Water Service Situation
#   Report (NOTIFICATIONS_DAILY_REPORT_DRY_RUN).
# sms.dry-run          → suppress SMSCountry OTP delivery (NOTIFICATIONS_SMS_DRY_RUN);
#   note login OTPs will not reach users when enabled.
#
# Contact opt-in is NOT gated by whatsapp.dry-run. It sends the recipient nothing and
# is the prerequisite for every delivery — without it receiverId is 0 and Glific
# rejects the send with "Receiver does not exist". It is suppressed only when every
# purpose above is muted, which a lone NOTIFICATIONS_WHATSAPP_DRY_RUN=true still does.
#
# To run daily reports live while everything else stays muted:
#   NOTIFICATIONS_WHATSAPP_DRY_RUN=true      (OTP/welcome/language muted)
#   NOTIFICATIONS_DAILY_REPORT_DRY_RUN=false (daily reports delivered; opt-in goes live)
#   Then, per delivery-mode (see notifications.daily-report.delivery-mode below), startup fails fast
#   unless the templates that mode sends are configured:
#     DOCUMENT → GLIFIC_DAILY_REPORT_SO_TEMPLATE_ID (numeric; _SDO_TEMPLATE_ID optional)
#     LINK     → GLIFIC_DAILY_REPORT_SO_LINK_TEMPLATE_ID (_SDO_LINK_TEMPLATE_ID optional)
#
# To run escalations live while keeping nudges muted:
#   NOTIFICATIONS_WHATSAPP_DRY_RUN=false   (OTP/welcome live)
#   NOTIFICATIONS_NUDGE_DRY_RUN=true       (nudges muted)
#   NOTIFICATIONS_ESCALATION_DRY_RUN=false (escalations delivered)
# ──────────────────────────────────────────────────────────────

notifications:
  whatsapp:
    dry-run: ${NOTIFICATIONS_WHATSAPP_DRY_RUN:false}
  nudge:
    dry-run: ${NOTIFICATIONS_NUDGE_DRY_RUN:${NOTIFICATIONS_WHATSAPP_DRY_RUN:false}}
  escalation:
    dry-run: ${NOTIFICATIONS_ESCALATION_DRY_RUN:${NOTIFICATIONS_WHATSAPP_DRY_RUN:false}}
  daily-report:
    dry-run: ${NOTIFICATIONS_DAILY_REPORT_DRY_RUN:${NOTIFICATIONS_WHATSAPP_DRY_RUN:false}}
    
    # How the report PDF reaches the officer. DOCUMENT | LINK (case-insensitive).
    #
    #   DOCUMENT — the PDF as a WhatsApp document. Glific registers the MinIO URL and META
    #              DOWNLOADS IT ITSELF. Production MinIO answers Indian source addresses only, so
    #              that download fails inside Meta with "(#131053) Media upload error — Your server
    #              hosting media content did not respond back in time" and the officer receives an
    #              attachment that will not open.
    #   LINK     — a text HSM whose "View Report" button carries the MinIO path. Meta fetches
    #              nothing; the officer's phone opens the PDF, from inside India, when they tap it.
    #              Requires an approved link template (glific.template.daily-report-*-link-id).
    #
    # Rollback is this flag plus a restart — both paths stay in the code.
    delivery-mode: ${NOTIFICATIONS_DAILY_REPORT_DELIVERY_MODE:DOCUMENT}
  sms:
    dry-run: ${NOTIFICATIONS_SMS_DRY_RUN:false}

# ──────────────────────────────────────────────────────────────
# Glific GraphQL API (WhatsApp HSM)
# ──────────────────────────────────────────────────────────────

glific:
  api-url: ${GLIFIC_API_URL:https://api.arghyam.glific.com/api}
  auth-url: ${GLIFIC_AUTH_URL:https://api.arghyam.glific.com/api/v1/session}
  request-interval-ms: ${GLIFIC_REQUEST_INTERVAL_MS:500}
  username: ${GLIFIC_USERNAME:}
  password: ${GLIFIC_PASSWORD:}
  template:
    nudge-id: ${GLIFIC_NUDGE_TEMPLATE_ID:}
    escalation-id: ${GLIFIC_ESCALATION_TEMPLATE_ID:}
    login-otp-id: ${GLIFIC_LOGIN_OTP_TEMPLATE_ID:}
    daily-report-so-id: ${GLIFIC_DAILY_REPORT_SO_TEMPLATE_ID:}
    daily-report-sdo-id: ${GLIFIC_DAILY_REPORT_SDO_TEMPLATE_ID:}
    # Link templates — used only when notifications.daily-report.delivery-mode=LINK. These are text
    # HSMs with a dynamic-URL button, NOT document templates, so they are separate approvals.
    # Variables: {{1}} officer name, {{2}} report date (dd-MM-yyyy), then the button's URL suffix.
    # The button's fixed prefix is frozen at approval and must equal MINIO_BASE_URL + "/", which is
    # why staging and production each need their own template id.
    daily-report-so-link-id: ${GLIFIC_DAILY_REPORT_SO_LINK_TEMPLATE_ID:}
    # Optional — falls back to the SO link template when blank.
    daily-report-sdo-link-id: ${GLIFIC_DAILY_REPORT_SDO_LINK_TEMPLATE_ID:}
  flow:
    nudge-id: ${GLIFIC_NUDGE_FLOW_ID:}
    welcome-id: ${GLIFIC_WELCOME_FLOW_ID:38949}
  media:
    escalation-caption: ${GLIFIC_ESCALATION_CAPTION:Escalations}
    escalation-thumbnail: ${GLIFIC_ESCALATION_THUMBNAIL:}
    # Base name of the report document as the officer sees it in WhatsApp. The date of the data the
    # report covers (D-1) is appended at send time, e.g. "… Report 13-08-2026" for a 14 Aug delivery,
    # so configure the name only — do not put a date here.
    daily-report-caption: ${GLIFIC_DAILY_REPORT_CAPTION:Daily Water Service Situation Report}

  # ────────────────────────────────────────────────────────────
  # Delivery-status reconciliation (GlificDeliveryReconciliationService)
  #
  # result=SENT only means Glific ACCEPTED our API call. Gupshup and Meta act afterwards and report
  # delivery status back to Glific alone, so a report sent to a number with no WhatsApp account is
  # counted as sent exactly like one that arrived. This job reads that status back and logs it under
  # the [GlificStatus] prefix
  # ────────────────────────────────────────────────────────────
  status:
    reconcile:
      # Off by default: the pass shares the 500 ms Glific throttle with live sends, so a deployment
      # opts in once window-hours and interval-ms suit its volume.
      enabled: ${GLIFIC_STATUS_RECONCILE_ENABLED:false}
      interval-ms: ${GLIFIC_STATUS_RECONCILE_INTERVAL_MS:1800000} # every 30 min
      initial-delay-ms: ${GLIFIC_STATUS_RECONCILE_INITIAL_DELAY_MS:600000}
      # Rolling look-back, NOT a fixed hour: the daily-report cron is configurable per tenant via
      # common_schema.tenant_config_master_table key DAILY_SITUATION_REPORT_TIME, so no single hour
      # is right for every tenant. Keep it tight — a wide window costs pages of unrelated traffic.
      window-hours: ${GLIFIC_STATUS_RECONCILE_WINDOW_HOURS:6}
      page-size: ${GLIFIC_STATUS_RECONCILE_PAGE_SIZE:250}
      # Hard stop per status so a pathological window cannot consume the whole throttle budget.
      # Hitting it is logged at WARN — truncated results would silently under-report delivery.
      max-pages: ${GLIFIC_STATUS_RECONCILE_MAX_PAGES:40}
      # Glific's dateRange column. inserted_at is when the message row was created and is stable;
      # updated_at moves on every status change and would let a message drift out of its send window.
      date-column: ${GLIFIC_STATUS_RECONCILE_DATE_COLUMN:inserted_at}
      # Blank = derive from the glific.template.daily-report-* ids above. Set explicitly only to
      # reconcile templates this service does not itself send.
      template-ids: ${GLIFIC_STATUS_RECONCILE_TEMPLATE_IDS:}
      # Failure codes that are properties of the Gupshup ACCOUNT, not of any recipient. 9999 is
      # "low balance": it fails every message in flight, so it is reported on its own line instead of
      # being counted as N officer failures, which would read as a mass recipient-data problem.
      account-level-error-codes: ${GLIFIC_STATUS_RECONCILE_ACCOUNT_LEVEL_ERROR_CODES:9999}

# ──────────────────────────────────────────────────────────────
# SMSCountry REST API (SMS OTP delivery)
# ──────────────────────────────────────────────────────────────

smscountry:
  base-url: ${SMSCOUNTRY_BASE_URL:https://restapi.smscountry.com/v0.1}
  auth-key: ${SMSCOUNTRY_AUTH_KEY:}
  auth-token: ${SMSCOUNTRY_AUTH_TOKEN:}
  sender-id: ${SMSCOUNTRY_SENDER_ID:ARGHYM}
  dlt-principal-entity-id: ${SMSCOUNTRY_DLT_PE_ID:1701177400802435652}
  dlt-template-id: ${SMSCOUNTRY_DLT_TEMPLATE_ID:1707177451874727981}
  dlt-header-id: ${SMSCOUNTRY_DLT_HEADER_ID:1705177444898758356}

# ──────────────────────────────────────────────────────────────
# MinIO Object Storage (escalation + daily report PDF hosting)
#
# endpoint and base-url are two DIFFERENT addresses. Setting them to the same
# internal value is the mistake to avoid:
#
#   endpoint → where THIS SERVICE uploads to. Internal is correct
#              (cluster IP, container name, localhost).
#   base-url → the prefix of the URL handed to Glific. Glific registers it and
#              META DOWNLOADS IT FROM THE PUBLIC INTERNET. Must be publicly
#              reachable AND anonymously readable.
#
# Production: MINIO_BASE_URL=https://jalsoochak.jjmbrain.in/minio
#   → https://jalsoochak.jjmbrain.in/minio/escalation-reports/<file>.pdf
#
# An internal address here uploads fine and returns a Glific media id, then fails
# inside Meta with "(#131053) Media upload error … blocked by a destination
# filter" — the officer gets a document that will not open. The service now
# refuses to start when a document-sending purpose is live and base-url is a
# private, loopback or single-label address.
#
# The bucket must allow anonymous GET (Meta sends no credentials):
#   mc anonymous set download <alias>/escalation-reports
# Verify from OUTSIDE the network before enabling delivery:
#   curl -sSI https://jalsoochak.jjmbrain.in/minio/escalation-reports/<file>.pdf
# ──────────────────────────────────────────────────────────────

minio:
  endpoint: ${MINIO_ENDPOINT:https://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:escalation-reports}
  base-url: ${MINIO_BASE_URL:https://localhost:9000}

logging:
  file:
    name: ${LOG_FILE_PATH:../logger/logs/backend-services.log}
  pattern:
    level: "service=${spring.application.name} %5p"
