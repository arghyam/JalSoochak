springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Must equal <swagger-ui.version> in pom.xml. springdoc 2.6.0 ships
    # springdoc.config.properties with springdoc.swagger-ui.version=5.17.14 and uses it to
    # build the webjar resource path (AbstractSwaggerResourceResolver), so without this
    # override every /webjars/swagger-ui/** asset 404s against the pinned webjar.
    version: 5.32.14
    # Disable client-side syntax highlighting. highlight.js' recursive
    # processLines overflows the JS call stack ("Maximum call stack size
    # exceeded") on large/deeply nested responses (e.g. the analytics
    # water-quantity/region-wise endpoint), producing "Could not render
    # responses". This aggregated UI is what staging serves, so the setting
    # must live here. Plain-text rendering skips the highlighter; the
    # response body still renders in full.
    syntax-highlight:
      activated: false
    urls:
      - name: user-service
        url: /user/v3/api-docs
      - name: tenant-service
        url: /tenant/v3/api-docs
      - name: telemetry-service
        url: /telemetry/v3/api-docs
      - name: message-service
        url: /message/v3/api-docs
      - name: scheme-service
        url: /scheme/v3/api-docs
      - name: analytics-service
        url: /analytics/v3/api-docs

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  health:
    redis:
      # RedisRateLimiter fails open when Redis is unreachable, so traffic keeps flowing through a
      # Redis outage. Left enabled, this indicator would still turn /actuator/health DOWN and fail
      # the readiness probe — taking the gateway, and every service behind it, out of rotation.
      enabled: false
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,gateway"

logging:
  file:
    name: ${LOG_FILE_PATH:../logger/logs/backend-services.log}
  pattern:
    level: "service=${spring.application.name} %5p"
