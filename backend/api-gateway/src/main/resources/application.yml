server:
  port: 8080

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:false}
  default:
    replenish-rate: ${RATE_LIMIT_DEFAULT_REPLENISH_RATE:20}
    burst-capacity: ${RATE_LIMIT_DEFAULT_BURST_CAPACITY:40}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://jalsoochak.beehyv.com/keycloak/realms/jalsoochak-realm}
  cloud:
    gateway:
      routes:
        # OTP and login are the abuse-prone, unauthenticated entry points, so they are limited far
        # harder than the default below. Each endpoint is reachable twice (flat and /user/-prefixed);
        # userOrIpKeyResolver folds the "-flat" alias onto the same bucket, so both paths draw on one
        # allowance and must therefore declare identical limits.
        - id: otp-rate-limited-flat
          uri: ${USER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/auth/staff/otp, /api/v1/auth/staff/otp/verify
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_OTP_REPLENISH_RATE:1}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_OTP_BURST_CAPACITY:5}

        - id: otp-rate-limited
          uri: ${USER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/user/api/v1/auth/staff/otp, /user/api/v1/auth/staff/otp/verify
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_OTP_REPLENISH_RATE:1}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_OTP_BURST_CAPACITY:5}

        - id: auth-rate-limited-flat
          uri: ${USER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_AUTH_REPLENISH_RATE:2}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_AUTH_BURST_CAPACITY:10}

        - id: auth-rate-limited
          uri: ${USER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/user/api/v1/auth/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_AUTH_REPLENISH_RATE:2}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_AUTH_BURST_CAPACITY:10}

        - id: pumpoperator-public
          uri: ${USER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/pumpoperator/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_DEFAULT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_DEFAULT_BURST_CAPACITY:40}

        - id: tenant-staff-flat
          uri: ${USER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/tenant/staff
          filters:
            - SetPath=/api/v1/tenant/user/staff
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_DEFAULT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_DEFAULT_BURST_CAPACITY:40}

        - id: tenant-staff-counts-flat
          uri: ${USER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/tenant/staff/counts/by-role
          filters:
            - SetPath=/api/v1/tenant/user/staff/counts/by-role
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_DEFAULT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_DEFAULT_BURST_CAPACITY:40}

        - id: user-service-flat
          uri: ${USER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/users/**, /api/v1/tenant/user/**, /api/v1/state-admin/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_DEFAULT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_DEFAULT_BURST_CAPACITY:40}

        - id: tenant-service-flat
          uri: ${TENANT_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/tenants/**, /api/v1/system/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_DEFAULT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_DEFAULT_BURST_CAPACITY:40}

        - id: telemetry-service-flat
          uri: ${TELEMETRY_SERVICE_URI:http://localhost:8084}
