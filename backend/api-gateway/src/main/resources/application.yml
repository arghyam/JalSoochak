server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://jalsoochak.beehyv.com/keycloak/realms/jalsoochak-realm}
  cloud:
    gateway:
      routes:
        - id: pumpoperator-public
          uri: ${USER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/pumpoperator/**

        - id: user-service-flat
          uri: ${USER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**, /api/v1/tenant/user/**, /api/v1/state-admin/**

        - id: tenant-service-flat
          uri: ${TENANT_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/tenants/**, /api/v1/system/**, /api/v1/tenant-config/**, /api/v1/locations/**

        - id: telemetry-service-flat
          uri: ${TELEMETRY_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/telemetry/**

        - id: scheme-service-flat
          uri: ${SCHEME_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/scheme/**, /api/v1/public/**

        - id: analytics-service-flat
          uri: ${ANALYTICS_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/v1/analytics/**

        - id: message-service-flat
          uri: ${MESSAGE_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/message/**

        - id: anomaly-service-flat
          uri: ${ANOMALY_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/anomalies/**

        - id: tenant-service
          uri: ${TENANT_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/tenant/**
          filters:
            - StripPrefix=1

        - id: user-service
          uri: ${USER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1

        - id: anomaly-service
          uri: ${ANOMALY_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/anomaly/**
          filters:
            - StripPrefix=1

        - id: telemetry-service
          uri: ${TELEMETRY_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/telemetry/**
          filters:
            - StripPrefix=1

        - id: message-service
          uri: ${MESSAGE_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/message/**
          filters:
            - StripPrefix=1

        - id: scheme-service
          uri: ${SCHEME_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/scheme/**
          filters:
            - StripPrefix=1

        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/analytics/**
          filters:
            - StripPrefix=1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    syntax-highlight:
      activated: false
    urls:
      - name: user-service
        url: /user/v3/api-docs
      - name: tenant-service
        url: /tenant/v3/api-docs
      - name: telemetry-service
        url: /telemetry/v3/api-docs
      - name: message-service
        url: /message/v3/api-docs
      - name: scheme-service
        url: /scheme/v3/api-docs
      - name: analytics-service
        url: /analytics/v3/api-docs
      - name: anomaly-service
        url: /anomaly/v3/api-docs

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,gateway"

logging:
  file:
    name: ${LOG_FILE_PATH:../logger/logs/backend-services.log}
  pattern:
    level: "service=${spring.application.name} %5p"
