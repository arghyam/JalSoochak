app:
  single-tenant-mode: ${SINGLE_TENANT_MODE:false}

server:
  port: 8086

spring:
  config:
    import: optional:file:./scheme-service/.env[.properties],optional:file:.env[.properties]

  application:
    name: scheme-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://jalsoochak.beehyv.com/keycloak/realms/jalsoochak-realm}

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: scheme-service-group
      auto-offset-reset: earliest

keycloak:
  realm: ${KEYCLOAK_REALM:jalsoochak-realm}
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:https://jalsoochak.beehyv.com/keycloak}
  resource: ${KEYCLOAK_CLIENT_ID:scheme-client}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Must equal <swagger-ui.version> in pom.xml. springdoc 2.5.0 ships
    # springdoc.config.properties with springdoc.swagger-ui.version=5.13.0 and uses it to
    # build the webjar resource path (AbstractSwaggerResourceResolver), so without this
    # override every /webjars/swagger-ui/** asset 404s against the pinned webjar.
    version: 5.32.14
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  file:
    name: ${LOG_FILE_PATH:../logger/logs/backend-services.log}
  pattern:
    level: "service=${spring.application.name} %5p"

storage:
  enabled: ${STORAGE_ENABLED:true}
  endpoint: ${STORAGE_ENDPOINT:} # required; URL of the S3-compatible store
  region: ${STORAGE_REGION:us-east-1}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  reports-bucket: ${STORAGE_REPORTS_BUCKET:jalsoochak-reports}
  presigned-base-url: ${STORAGE_PRESIGNED_BASE_URL:} # public origin for download links; blank = the URL as signed
  presigned-ttl-seconds: ${STORAGE_PRESIGNED_TTL_SECONDS:3600}

# State master-data sync (Assam: JJM Brain). Off unless STATE_SYNC_ENABLED=true; with it off no
# schedule is registered and the upstream is never called. Start in DRY_RUN: runs record counts and
# issues (GET /api/v1/scheme/state-sync/issues) but roll back every write.
state-sync:
  enabled: ${STATE_SYNC_ENABLED:false}
  mode: ${STATE_SYNC_MODE:DRY_RUN}
  tenant-code: ${STATE_SYNC_TENANT_CODE:}
  actor-user-id: ${STATE_SYNC_ACTOR_USER_ID:}
  delta-cron: ${STATE_SYNC_DELTA_CRON:0 15 * * * *}
  full-cron: ${STATE_SYNC_FULL_CRON:0 0 2 * * *}
  zone: ${STATE_SYNC_ZONE:Asia/Kolkata}
  delta-overlap: ${STATE_SYNC_DELTA_OVERLAP:PT30M}
  stale-run-after: ${STATE_SYNC_STALE_RUN_AFTER:PT2H}
  archive-spare-reading-days: ${STATE_SYNC_ARCHIVE_SPARE_READING_DAYS:90}
  retire-on-empty-list: ${STATE_SYNC_RETIRE_ON_EMPTY_LIST:false}
  placeholder-lookups-per-run: ${STATE_SYNC_PLACEHOLDER_LOOKUPS_PER_RUN:25}
  placeholder-retry-after: ${STATE_SYNC_PLACEHOLDER_RETRY_AFTER:PT24H}
  jjm:
    base-url: ${JJM_BRAIN_BASE_URL:https://jjmbrain.in/api/v1}
    api-key: ${JJM_BRAIN_API_KEY:}
    min-request-interval: ${JJM_BRAIN_MIN_REQUEST_INTERVAL:PT0.5S}
    max-attempts: ${JJM_BRAIN_MAX_ATTEMPTS:4}
