app:
  single-tenant-mode: ${SINGLE_TENANT_MODE:false}

server:
  port: 8086

spring:
  config:
    import: optional:file:./scheme-service/.env[.properties],optional:file:.env[.properties]

  application:
    name: scheme-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://jalsoochak.beehyv.com/keycloak/realms/jalsoochak-realm}

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: scheme-service-group
      auto-offset-reset: earliest

keycloak:
  realm: ${KEYCLOAK_REALM:jalsoochak-realm}
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:https://jalsoochak.beehyv.com/keycloak}
  resource: ${KEYCLOAK_CLIENT_ID:scheme-client}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  file:
    name: ${LOG_FILE_PATH:../logger/logs/backend-services.log}
  pattern:
    level: "service=${spring.application.name} %5p"

minio:
  endpoint: ${MINIO_ENDPOINT}
  bucket: ${MINIO_BUCKET}
  reports-bucket: ${MINIO_REPORTS_BUCKET:${STORAGE_REPORTS_BUCKET:jalsoochak-reports}}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  region: ${MINIO_REGION:us-east-1}
  presigned-base-url: ${MINIO_PRESIGNED_BASE_URL:${MINIO_BASE_URL:${STORAGE_PRESIGNED_BASE_URL:}}}
  presigned-ttl-seconds: ${MINIO_PRESIGNED_TTL_SECONDS:3600}
